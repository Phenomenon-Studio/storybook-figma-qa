name: CI

on:
    push:
        branches: [main]
    pull_request:
    # Publish runs the same checks on the release commit before it publishes.
    workflow_call:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    fixture:
        name: ${{ matrix.fixture }} · Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                fixture: [sb10, sb11]
                node: ['22.12.0', lts/*]
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            # `figma-qa` bin only links once dist/cli.js exists.
            - run: pnpm install --frozen-lockfile --offline
            - run: pnpm typecheck
            - run: pnpm test
            - name: figma-qa doctor
              working-directory: fixtures/${{ matrix.fixture }}
              run: pnpm exec figma-qa doctor
            - name: Build Storybook
              working-directory: fixtures/${{ matrix.fixture }}
              run: pnpm build-storybook
            - run: pnpm exec playwright install --with-deps chromium
            - name: Kit panel visible
              run: pnpm smoke:panel fixtures/${{ matrix.fixture }}/storybook-static
