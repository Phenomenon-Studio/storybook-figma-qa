name: Publish

# A published GitHub Release publishes the package to GitHub Packages with the
# workflow's own GITHUB_TOKEN: no publish secret exists.
on:
    release:
        types: [published]

concurrency:
    group: publish
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    ci:
        uses: ./.github/workflows/ci.yml

    publish:
        needs: ci
        runs-on: ubuntu-latest
        permissions:
            # Moves the `vN` tag that consumers pin the reusable workflow to.
            contents: write
            packages: write
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: pnpm
                  registry-url: https://npm.pkg.github.com
                  scope: '@phenomenon-studio'
            # The release decides the dist-tag, so tag, version and prerelease flag must agree:
            # `vX.Y.Z` → latest + move `vX`; prerelease `vX.Y.Z-next.N` → `next`, `vX` untouched.
            - name: Resolve release
              id: release
              env:
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  PRERELEASE: ${{ github.event.release.prerelease }}
              run: |
                  version=$(node -p "require('./packages/storybook-figma-qa/package.json').version")
                  if [ "$RELEASE_TAG" != "v$version" ]; then
                      echo "::error::Release tag $RELEASE_TAG does not match package version $version (expected v$version)"
                      exit 1
                  fi
                  if [ "$PRERELEASE" = "true" ]; then
                      if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-next\.[0-9]+$ ]]; then
                          echo "::error::Prerelease version $version must be X.Y.Z-next.N"
                          exit 1
                      fi
                      echo "dist-tag=next" >> "$GITHUB_OUTPUT"
                  else
                      if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                          echo "::error::Version $version is a prerelease: mark the GitHub Release as a pre-release"
                          exit 1
                      fi
                      echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
                      echo "major-tag=v${version%%.*}" >> "$GITHUB_OUTPUT"
                  fi
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - name: npm publish
              working-directory: packages/storybook-figma-qa
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npm publish --tag "${{ steps.release.outputs.dist-tag }}"
            # After publish, so `vN` never points at a commit whose package is missing.
            - name: Move major tag
              if: steps.release.outputs.major-tag
              env:
                  MAJOR_TAG: ${{ steps.release.outputs.major-tag }}
              run: |
                  git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
                  git push -f origin "refs/tags/$MAJOR_TAG"
