name: Nightly live Figma

# PR CI runs offline against committed refs and recorded Figma responses; this job is the
# only one that talks to live Figma, so it is the only one that holds FIGMA_TOKEN.
on:
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

concurrency:
    group: nightly
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    token:
        name: FIGMA_TOKEN present
        runs-on: ubuntu-latest
        outputs:
            present: ${{ steps.check.outputs.present }}
        steps:
            - id: check
              env:
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
              run: |
                  if [ -z "$FIGMA_TOKEN" ]; then
                      echo "::notice::FIGMA_TOKEN secret is not set: live Figma check skipped"
                      echo "present=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  fi

    live-figma:
        name: sb11 · live Figma
        needs: token
        if: needs.token.outputs.present == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0, pinned: job holds FIGMA_TOKEN
            - uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            # `figma-qa` bin only links once dist/cli.js exists.
            - run: pnpm install --frozen-lockfile --offline
            # No --host-browser: committed refs are captured in the kit-pinned Playwright image, so
            # host Chromium pixels would fail spuriously. The browser service container joins this
            # job once the kit pins that image.
            - name: figma-qa report --refresh
              working-directory: fixtures/sb11
              env:
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
              run: pnpm exec figma-qa report --refresh --ci
