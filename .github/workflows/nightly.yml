name: Nightly live Figma

# PR CI runs offline against committed refs and recorded Figma responses; this job is the
# only one that talks to live Figma, so it is the only one that holds FIGMA_TOKEN.
on:
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

concurrency:
    group: nightly
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    live-figma:
        name: sb11 · live Figma
        runs-on: ubuntu-latest
        env:
            FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        steps:
            - name: Check FIGMA_TOKEN
              id: token
              run: |
                  if [ -z "$FIGMA_TOKEN" ]; then
                      echo "::notice::FIGMA_TOKEN secret is not set: live Figma check skipped"
                      echo "present=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  fi
            - if: steps.token.outputs.present == 'true'
              uses: actions/checkout@v5
            - if: steps.token.outputs.present == 'true'
              uses: pnpm/action-setup@v4
            - if: steps.token.outputs.present == 'true'
              uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: pnpm
            - if: steps.token.outputs.present == 'true'
              run: pnpm install --frozen-lockfile
            - if: steps.token.outputs.present == 'true'
              run: pnpm build
            # `figma-qa` bin only links once dist/cli.js exists.
            - if: steps.token.outputs.present == 'true'
              run: pnpm install --frozen-lockfile --offline
            - if: steps.token.outputs.present == 'true'
              run: pnpm exec playwright install --with-deps chromium
            - name: figma-qa report --refresh
              if: steps.token.outputs.present == 'true'
              working-directory: fixtures/sb11
              run: pnpm exec figma-qa report --refresh --ci --host-browser
